<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التقييمات — مشكاة الروح</title>
    <link rel="icon" type="image/jpeg" href="logo.jpeg">
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --dg: #1a4a3a;
            --mg: #2d6a4f;
            --lg: #40916c;
            --gd: #c9a84c;
            --gl: #e8c97a;
            --gdk: #a07830;
            --cr: #f5efe0;
            --crd: #ede0c4;
            --crl: #fdf8ee;
            --dt: #1a1a1a;
            --st: #4a4a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Naskh Arabic', 'Amiri', serif;
            background: linear-gradient(160deg, #060f09 0%, #0d2318 40%, #060e08 100%);
            color: #fff;
            min-height: 100vh;
            direction: rtl;
            text-align: right;
        }

        /* HEADER */
        header {
            background: rgba(10, 30, 22, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(201, 168, 76, 0.2);
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .hinner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            gap: 14px;
        }

        .hlogo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hlogo img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--gd);
            object-fit: cover;
        }

        .hlogo span {
            font-family: 'Amiri', serif;
            font-size: 18px;
            color: var(--gl);
            white-space: nowrap;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 13px;
            padding: 7px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            transition: all 0.2s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* HERO */
        .hero {
            text-align: center;
            padding: 60px 24px 40px;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(201, 168, 76, 0.07) 0%, transparent 60%);
            pointer-events: none;
        }

        .hero-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--gd), var(--gl));
            color: var(--dg);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 16px;
            border-radius: 20px;
            margin-bottom: 14px;
        }

        .hero h1 {
            font-family: 'Amiri', serif;
            font-size: clamp(28px, 5vw, 46px);
            color: #fff;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.55);
            max-width: 460px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* STATS CARDS */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            max-width: 1100px;
            margin: 0 auto 40px;
            padding: 0 24px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(201, 168, 76, 0.18);
            border-radius: 18px;
            padding: 22px 18px;
            text-align: center;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(201, 168, 76, 0.1);
        }

        .stat-icon {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .stat-val {
            font-size: 34px;
            font-weight: 700;
            color: var(--gl);
            font-variant-numeric: tabular-nums;
            line-height: 1;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* STAR DISTRIBUTION */
        .distribution-wrap {
            max-width: 1100px;
            margin: 0 auto 40px;
            padding: 0 24px;
        }

        .dist-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(201, 168, 76, 0.15);
            border-radius: 20px;
            padding: 28px 28px;
        }

        .dist-card h3 {
            font-family: 'Amiri', serif;
            font-size: 18px;
            color: var(--gl);
            margin-bottom: 18px;
        }

        .dist-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .dist-label {
            font-size: 14px;
            white-space: nowrap;
            min-width: 60px;
        }

        .dist-bar-wrap {
            flex: 1;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
        }

        .dist-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--gd), var(--gl));
            border-radius: 8px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dist-count {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            min-width: 28px;
            text-align: center;
        }

        /* FILTER / SORT BAR */
        .filter-bar {
            max-width: 1100px;
            margin: 0 auto 20px;
            padding: 0 24px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
        }

        .filter-select {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(201, 168, 76, 0.25);
            border-radius: 20px;
            color: #fff;
            font-family: 'Noto Naskh Arabic', serif;
            font-size: 12.5px;
            padding: 7px 14px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .filter-select:focus {
            border-color: var(--gd);
        }

        .filter-select option {
            background: #0d2318;
        }

        .clear-btn {
            margin-right: auto;
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: rgba(255, 100, 100, 0.85);
            font-family: 'Noto Naskh Arabic', serif;
            font-size: 12.5px;
            padding: 7px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: rgba(220, 53, 69, 0.25);
            color: #fff;
        }

        /* FEEDBACK ENTRIES */
        .entries-wrap {
            max-width: 1100px;
            margin: 0 auto 60px;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .entry-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(201, 168, 76, 0.12);
            border-right: 3px solid var(--gd);
            border-radius: 18px;
            padding: 22px 24px;
            animation: slideIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) both;
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .entry-card:hover {
            box-shadow: 0 8px 32px rgba(201, 168, 76, 0.08);
            transform: translateX(-2px);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .entry-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .entry-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .entry-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--dg), var(--mg));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
            border: 1.5px solid rgba(201, 168, 76, 0.3);
        }

        .entry-name {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .entry-date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        .entry-stars {
            font-size: 20px;
            letter-spacing: 2px;
        }

        .entry-feedback {
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.8;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 10px;
            margin-top: 4px;
        }

        .entry-feedback.no-feedback {
            color: rgba(255, 255, 255, 0.3);
            font-style: italic;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state .empty-ico {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-family: 'Amiri', serif;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 13px;
            line-height: 1.8;
        }

        /* EXPORT BTN */
        .export-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(201, 168, 76, 0.25);
            color: var(--gl);
            font-family: 'Noto Naskh Arabic', serif;
            font-size: 12.5px;
            padding: 7px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .export-btn:hover {
            background: rgba(201, 168, 76, 0.15);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 7px;
        }

        ::-webkit-scrollbar-track {
            background: #0a1e16;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--mg);
            border-radius: 4px;
        }

        /* FOOTER */
        footer {
            border-top: 1px solid rgba(201, 168, 76, 0.12);
            padding: 24px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        footer a {
            color: var(--gl);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media(max-width: 576px) {
            .stats-row {
                grid-template-columns: 1fr 1fr;
            }

            .hlogo span {
                font-size: 15px;
            }

            .entry-card {
                padding: 16px 18px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="hinner">
            <div class="hlogo">
                <img src="logo.jpeg" alt="مشكاة الروح">
                <span>مشكاة الروح — لوحة التقييمات</span>
            </div>
            <a class="back-link" href="index.html">← العودة للموقع</a>
        </div>
    </header>

    <!-- HERO -->
    <div class="hero">
        <div class="hero-badge">📊 لوحة الإدارة</div>
        <h1>تقييمات الزوار</h1>
        <p>استعرض آراء وتقييمات زوار مشكاة الروح واقتراحاتهم لتحسين الموقع</p>
    </div>

    <!-- STATS ROW -->
    <div class="stats-row" id="statsRow">
        <div class="stat-card">
            <div class="stat-icon">📝</div>
            <div class="stat-val" id="totalCount">0</div>
            <div class="stat-label">إجمالي التقييمات</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">⭐</div>
            <div class="stat-val" id="avgRating">0.0</div>
            <div class="stat-label">متوسط التقييم</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">💬</div>
            <div class="stat-val" id="withFeedback">0</div>
            <div class="stat-label">مع تعليق</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🏆</div>
            <div class="stat-val" id="fiveStarPct">0%</div>
            <div class="stat-label">تقييم ٥ نجوم</div>
        </div>
    </div>

    <!-- STAR DISTRIBUTION -->
    <div class="distribution-wrap">
        <div class="dist-card">
            <h3>📊 توزيع النجوم</h3>
            <div id="distRows"></div>
        </div>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
        <label>تصفية:</label>
        <select class="filter-select" id="filterStars" onchange="renderEntries()">
            <option value="all">جميع التقييمات</option>
            <option value="5">⭐⭐⭐⭐⭐ (٥ نجوم)</option>
            <option value="4">⭐⭐⭐⭐ (٤ نجوم)</option>
            <option value="3">⭐⭐⭐ (٣ نجوم)</option>
            <option value="2">⭐⭐ (٢ نجوم)</option>
            <option value="1">⭐ (نجمة)</option>
        </select>
        <select class="filter-select" id="sortOrder" onchange="renderEntries()">
            <option value="newest">الأحدث أولاً</option>
            <option value="oldest">الأقدم أولاً</option>
            <option value="highest">الأعلى تقييماً</option>
            <option value="lowest">الأدنى تقييماً</option>
        </select>
        <button class="export-btn" onclick="exportCSV()">⬇️ تصدير CSV</button>
        <button class="clear-btn" onclick="clearAllFeedback()">🗑️ حذف الكل</button>
    </div>

    <!-- ENTRIES -->
    <div class="entries-wrap" id="entriesWrap"></div>

    <footer>
        لوحة تقييمات <a href="index.html">مشكاة الروح</a> — البيانات مخزنة في المتصفح
    </footer>

    <script>
        const KEY = 'mishkat_feedback_log';

        function loadData() {
            try { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
            catch (e) { return []; }
        }

        function starsHtml(n) {
            return '⭐'.repeat(n) + (n < 5 ? '<span style="opacity:0.2">⭐'.repeat(5 - n) + '</span>' : '');
        }

        function updateStats(data) {
            const total = data.length;
            document.getElementById('totalCount').textContent = total;
            if (!total) {
                document.getElementById('avgRating').textContent = '—';
                document.getElementById('withFeedback').textContent = '0';
                document.getElementById('fiveStarPct').textContent = '0%';
                document.getElementById('distRows').innerHTML = '<div style="color:rgba(255,255,255,0.3);font-size:13px">لا توجد بيانات بعد</div>';
                return;
            }
            const avg = (data.reduce((s, e) => s + e.rating, 0) / total).toFixed(1);
            const wf = data.filter(e => e.feedback && e.feedback !== '—').length;
            const five = data.filter(e => e.rating === 5).length;
            document.getElementById('avgRating').textContent = avg;
            document.getElementById('withFeedback').textContent = wf;
            document.getElementById('fiveStarPct').textContent = Math.round(five / total * 100) + '%';

            // Distribution
            const dist = [5, 4, 3, 2, 1].map(s => ({ s, count: data.filter(e => e.rating === s).length }));
            document.getElementById('distRows').innerHTML = dist.map(d => `
                <div class="dist-row">
                    <div class="dist-label">${'⭐'.repeat(d.s)} ${d.s}</div>
                    <div class="dist-bar-wrap">
                        <div class="dist-bar" style="width:${total ? Math.round(d.count / total * 100) : 0}%"></div>
                    </div>
                    <div class="dist-count">${d.count}</div>
                </div>
            `).join('');
        }

        function renderEntries() {
            let data = loadData();
            const filterVal = document.getElementById('filterStars').value;
            const sortVal = document.getElementById('sortOrder').value;

            if (filterVal !== 'all') data = data.filter(e => e.rating === parseInt(filterVal));

            data.sort((a, b) => {
                if (sortVal === 'newest') return b.id - a.id;
                if (sortVal === 'oldest') return a.id - b.id;
                if (sortVal === 'highest') return b.rating - a.rating;
                if (sortVal === 'lowest') return a.rating - b.rating;
                return 0;
            });

            const wrap = document.getElementById('entriesWrap');
            if (!data.length) {
                wrap.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-ico">🌙</div>
                        <h3>${filterVal !== 'all' ? 'لا توجد تقييمات بهذا الفلتر' : 'لا توجد تقييمات بعد'}</h3>
                        <p>${filterVal !== 'all' ? 'حاول تغيير معايير الفلتر' : 'ستظهر التقييمات هنا بعد مرور 5 دقائق على زيارة الموقع'}</p>
                    </div>`;
                return;
            }

            wrap.innerHTML = data.map((e, idx) => `
                <div class="entry-card" style="animation-delay:${idx * 0.05}s">
                    <div class="entry-header">
                        <div class="entry-user">
                            <div class="entry-avatar">👤</div>
                            <div>
                                <div class="entry-name">${escHtml(e.user || 'زائر')}</div>
                                <div class="entry-date">${escHtml(e.date || '')}</div>
                            </div>
                        </div>
                        <div class="entry-stars">${starsHtml(e.rating)}</div>
                    </div>
                    <div class="entry-feedback ${(!e.feedback || e.feedback === '—') ? 'no-feedback' : ''}">
                        ${(!e.feedback || e.feedback === '—') ? 'لم يترك تعليقاً' : escHtml(e.feedback)}
                    </div>
                </div>
            `).join('');
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function clearAllFeedback() {
            if (!confirm('هل أنت متأكد من حذف جميع التقييمات؟')) return;
            localStorage.removeItem(KEY);
            localStorage.removeItem('mishkat_rated');
            init();
        }

        function exportCSV() {
            const data = loadData();
            if (!data.length) { alert('لا توجد بيانات للتصدير'); return; }
            const header = ['ID', 'Date', 'User', 'Rating', 'Feedback', 'UA'];
            const rows = data.map(e => [
                e.id, e.date, e.user, e.rating,
                '"' + (e.feedback || '').replace(/"/g, '""') + '"',
                '"' + (e.ua || '').replace(/"/g, '""') + '"'
            ].join(','));
            const csv = [header.join(','), ...rows].join('\n');
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'mishkat_feedback_' + Date.now() + '.csv';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function init() {
            const data = loadData();
            updateStats(data);
            renderEntries();
        }

        window.onload = init;

        // Auto-refresh every 30s in case a new rating comes in
        setInterval(init, 30000);
    </script>
</body>

</html>
